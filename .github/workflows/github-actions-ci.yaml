name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "releases/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "P@ssw0rd12345!"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        volumes:
          - /tmp/other_databases_path:/tmp/other_databases_path
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore dependencies
        run: dotnet restore PosInformatique.Testing.Databases.slnx

      - name: Build solution
        run: dotnet build PosInformatique.Testing.Databases.slnx --configuration Release --no-restore

      - name: Install SQL Server command-line tools
        run: |
          set -o pipefail
          . /etc/os-release
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" | sudo tee /etc/apt/sources.list.d/msprod.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Prepare SQL databases directory
        run: |
          # Give the rights to the 'mssql' user to read/write in the /tmp/other_databases_path directory.
          docker exec --user root $(docker ps -qf "ancestor=mcr.microsoft.com/mssql/server:2022-latest") chown -R mssql:mssql /tmp/other_databases_path

      - name: Run tests
        run: |
          dotnet test PosInformatique.Testing.Databases.slnx \
          --configuration Release \
          --no-build \
          --coverage \
          --coverage-output-format cobertura \
          --coverage-settings CodeCoverage.runsettings \
          --report-trx \
          --results-directory ./TestResults
        env:
          SQL_SERVER_UNIT_TESTS_CONNECTION_STRING: "Data Source=localhost,1433;Database=master;User Id=sa;Password=P@ssw0rd12345!;TrustServerCertificate=True;"
          SQL_SERVER_UNIT_TESTS_OTHER_DATA_PATH: "/tmp/other_databases_path/"
  
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: |
            TestResults/**/*.trx

  build-samples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages of the samples
        run: nuget restore samples/PosInformatique.Testing.Databases.Samples.slnx

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build samples with Visual Studio
        run: msbuild "samples/PosInformatique.Testing.Databases.Samples.slnx" /p:Configuration=Debug
